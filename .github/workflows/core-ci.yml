name: Core CI
on:
  push:
    paths: ["core/**", ".github/workflows/core-ci.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core-ci.yml"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DLF_SESSION_SECRET: test-session-secret
      LANGFUSE_PUBLIC_KEY: test-public
      LANGFUSE_SECRET_KEY: test-secret
      LANGFUSE_HOST: https://langfuse.example.invalid
    defaults:
      run:
        working-directory: core/backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python -c "import app"
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: core
          push: false
