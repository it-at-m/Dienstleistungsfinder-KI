services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.15.5
    env_file:
      - fileName
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  core:
    build:
      context: ./core
    env_file:
      - path: ./core/backend/.env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    ports:
      - "8080:8080"

  indexer:
    profiles: [indexer]
    build:
      context: ./indexer
    env_file:
      - path: ./indexer/.env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

volumes:
  qdrant-data:
